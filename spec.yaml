id: subject_historic_current_comparison
requirements:
- name: ecoscope-platform
  version: ==2.25.3
  channel: https://repo.prefix.dev/ecoscope-workflows/
- name: ecoscope-workflows-ext-custom
  version: ==0.1.0rc14
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
- name: ecoscope-workflows-ext-ste
  version: ==0.0.0rc1
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
- name: pydeck
  version: ==0.9.2
  channel: conda-forge
task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped
workflow:
- name: Set Workflow Details
  id: workflow_details
  task: set_workflow_details
  partial:
    description: ''
- name: Set Groupers
  id: groupers
  task: set_groupers
  partial:
    groupers:
    - index_name: subject_name
- name: Trajectory Segment Filter
  id: segment_filter
  task: trajectory_segment_filter
  partial:
    min_length_meters: 0.001
    max_length_meters: 5000
    min_time_secs: 1
    max_time_secs: 21600
    min_speed_kmhr: 0.01
    max_speed_kmhr: 9.0
- name: BaseMap URLs
  id: base_maps_pydeck
  task: set_base_maps_pydeck
  partial:
    base_maps:
    - url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}
      opacity: 1
      max_zoom: 20
    - url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
      opacity: 0.5
      max_zoom: 20
- name: Set Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y %H:%M:%S'
- name: Connect to EarthRanger
  id: er_connection
  task: set_er_connection
- name: Subject Group
  id: subject_group_name
  task: set_string_var
- name: Current Subject Group Observations
  id: current_observations
  task: get_subjectgroup_observations
  partial:
    client: ${{ workflow.er_connection.return }}
    time_range: ${{ workflow.time_range.return }}
    subject_group_name: ${{ workflow.subject_group_name.return }}
    raise_on_empty: true
    include_details: false
    include_subjectsource_details: false
    filter: clean
    include_subject_additional: false
- name: Previous Period
  id: previous_time_range
  task: flexible_previous_period
  partial:
    timerange: ${{ workflow.time_range.return }}
    offset:
      preset: 1 month back
- name: Process Current Relocations
  id: current_relocations
  task: process_relocations
  partial:
    observations: ${{ workflow.current_observations.return }}
    filter_point_coords:
    - x: 180
      y: 90
    - x: 0
      y: 0
    - x: 1
      y: 1
    relocs_columns:
    - extra__subject_id
    - extra__id
    - extra__location
    - extra__created_at
    - extra__recorded_at
    - extra__source
    - extra__exclusion_flags
    - extra__subject__updated_at
    - extra__subject__name
    - extra__subject__hex
    - extra__subject__sex
    - extra__subject__subject_subtype
    - geometry
    - groupby_col
    - fixtime
    - junk_status
- name: Previous Subject Group Observations
  id: previous_observations
  task: get_subjectgroup_observations
  partial:
    client: ${{ workflow.er_connection.return }}
    time_range: ${{ workflow.previous_time_range.return }}
    subject_group_name: ${{ workflow.subject_group_name.return }}
    raise_on_empty: true
    include_details: false
    include_subjectsource_details: false
    filter: clean
    include_subject_additional: false
- name: Current Relocations to Trajectories
  id: current_relocs_to_trajs
  task: relocations_to_trajectory
  partial:
    relocations: ${{ workflow.current_relocations.return }}
    trajectory_segment_filter: ${{ workflow.segment_filter.return }}
- name: Process Previous Relocations
  id: previous_relocations
  task: process_relocations
  partial:
    observations: ${{ workflow.previous_observations.return }}
    filter_point_coords:
    - x: 180
      y: 90
    - x: 0
      y: 0
    - x: 1
      y: 1
    relocs_columns:
    - extra__subject_id
    - extra__id
    - extra__location
    - extra__created_at
    - extra__recorded_at
    - extra__source
    - extra__exclusion_flags
    - extra__subject__updated_at
    - extra__subject__name
    - extra__subject__hex
    - extra__subject__sex
    - extra__subject__subject_subtype
    - geometry
    - groupby_col
    - fixtime
    - junk_status
- name: Persist Previous Relocations
  id: persist_previous_relocations
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.previous_relocations.return }}
    filetype: geoparquet
    filename: previous_relocations
- name: Persist Current Relocations
  id: persist_current_relocations
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.current_relocations.return }}
    filename: current_relocations
    filetype: geoparquet
- name: Map Columns
  id: map_current_trajs
  task: map_columns
  partial:
    df: ${{ workflow.current_relocs_to_trajs.return }}
    rename_columns:
      extra__hex: hex_color
      extra__name: subject_name
      extra__sex: subject_sex
      extra__subject_subtype: subject_subtype
      extra__created_at: created_at
    drop_columns: &id001 []
    retain_columns: &id002 []
    raise_if_not_found: true
    duplicate_strategy: suffix
- name: Previous Relocations to Trajectories
  id: previous_relocs_to_trajs
  task: relocations_to_trajectory
  partial:
    relocations: ${{ workflow.previous_relocations.return }}
    trajectory_segment_filter:
      min_length_meters: 0.001
      max_length_meters: 100000
      min_time_secs: 1
      max_time_secs: 172800
      min_speed_kmhr: 0.01
      max_speed_kmhr: 500
- name: Persist Current Trajectories
  id: persist_current_trajectories
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.current_relocs_to_trajs.return }}
    filename: current_trajectories
    filetype: geoparquet
- name: Current Duration Status
  id: current_duration_status
  task: add_new_column
  partial:
    df: ${{ workflow.map_current_trajs.return }}
    column_name: duration_status
    default_value: Current Tracks
- name: Map Columns
  id: map_previous_trajs
  task: map_columns
  partial:
    df: ${{ workflow.previous_relocs_to_trajs.return }}
    rename_columns:
      extra__hex: hex_color
      extra__name: subject_name
      extra__sex: subject_sex
      extra__subject_subtype: subject_subtype
      extra__created_at: created_at
    drop_columns: *id001
    retain_columns: *id002
    raise_if_not_found: true
    duplicate_strategy: suffix
- name: Persist Previous Trajectories
  id: persist_previous_trajectories
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.previous_relocs_to_trajs.return }}
    filename: previous_trajectories
    filetype: geoparquet
- name: Previous Duration Status
  id: previous_duration_status
  task: add_new_column
  partial:
    df: ${{ workflow.map_previous_trajs.return }}
    column_name: duration_status
    default_value: Previous Tracks
- name: Concatenate Current and Previous Dataframes
  id: dataframes
  task: concatenate_dataframes
  partial:
    list_df:
    - ${{ workflow.previous_duration_status.return }}
    - ${{ workflow.current_duration_status.return }}
    axis: 0
    join: outer
    ignore_index: true
    keys: null
    levels: null
    names: null
    verify_integrity: false
    sort: false
    copy: null
- name: Add Temporal Index
  id: temporal_index
  task: add_temporal_index
  partial:
    df: ${{ workflow.dataframes.return }}
    groupers: ${{ workflow.groupers.return }}
    time_col: segment_start
    cast_to_datetime: true
    format: mixed
- name: Split Groups
  id: groups
  task: split_groups
  partial:
    df: ${{ workflow.temporal_index.return }}
    groupers: ${{ workflow.groupers.return }}
- name: Add Status Color Columns
  id: status_color_columns
  task: add_status_color_columns
  partial:
    hex_column: hex_color
    previous_color_hex: '#a9a9a9'
    default_current_hex: '#6495ed'
    current_status: Current Tracks
    use_hex_column_for_current: true
    status_column: duration_status
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.groups.return }}
- name: Sort Values by Duration Status
  id: sort_values_by_status
  task: sort_values
  partial:
    column_name: duration_status
    ascending: true
    na_position: last
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.status_color_columns.return }}
- name: Subset Columns
  id: columns
  task: subset_columns
  partial:
    columns:
    - duration_status
    - duration_status_colors
    - geometry
    - subject_name
    exclude: null
    strict: false
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.sort_values_by_status.return }}
- name: Create Path Layer
  id: path_layer
  task: ecoscope_workflows_ext_custom.tasks.results.create_path_layer
  partial:
    layer_style:
      auto_highlight: false
      opacity: 0.75
      pickable: true
      get_path: geometry.coordinates
      get_color: duration_status_colors
      get_width: 2.25
      width_scale: 1
      width_min_pixels: 0
      width_max_pixels: null
      width_units: pixels
      cap_rounded: true
      joint_rounded: false
      billboard: false
      rounded: true
      extruded: false
      wireframe: true
    legend:
      title: Legend
      label_column: duration_status
      color_column: duration_status_colors
      sort: ascending
      label_suffix: null
    data_url: null
  mapvalues:
    argnames:
    - geodataframe
    argvalues: ${{ workflow.columns.return }}
- name: Compute View State From Gdf
  id: view_state_from_gdf
  task: compute_view_state_from_gdf
  partial:
    pitch: 0
    bearing: 0
    max_zoom: 18.0
  mapvalues:
    argnames:
    - gdf
    argvalues: ${{ workflow.columns.return }}
- name: Groupbykey
  id: groupbykey_step
  task: groupbykey
  partial:
    iterables:
    - ${{ workflow.path_layer.return }}
    - ${{ workflow.view_state_from_gdf.return }}
- name: Draw Current Previous Map
  id: current_previous_map
  task: ecoscope_workflows_ext_custom.tasks.results.draw_map
  partial:
    tile_layers: ${{ workflow.base_maps_pydeck.return }}
    static: false
    title: ''
    legend_style:
      placement: bottom-right
    max_zoom: 20
  mapvalues:
    argnames:
    - geo_layers
    - view_state
    argvalues: ${{ workflow.groupbykey_step.return }}
- name: Persist map as HTML
  id: persist_map
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.current_previous_map.return }}
- name: Create Map Widget Single View
  id: map_widget_single_view
  task: create_map_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Movement Tracks
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.persist_map.return }}
- name: Gather Dashboard
  id: dashboard
  task: gather_dashboard
  partial:
    widgets: ${{ workflow.map_widget_single_view.return }}
    groupers: ${{ workflow.groupers.return }}
    time_range: ${{ workflow.time_range.return }}
    details: ${{ workflow.workflow_details.return }}
rjsf-overrides:
  uiSchema:
    ui:order:
    - workflow_details
    - er_connection
    - time_range
    - subject_group_name
