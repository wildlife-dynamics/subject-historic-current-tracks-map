id: subject_historic_current_comparison

metadata:
  name: Subject Historic and Current Tracks Map
  description: >-
    Maps each subject in an EarthRanger subject group with its tracks from the chosen time
    range drawn on top of its tracks from a historic period just before it. Current tracks
    are drawn in the subject's EarthRanger colour (or one picked colour) and historic tracks
    in grey, on one interactive map for the whole group or one map per subject.
  maintainers:
    - name: Tevin Temu
      email: tevin@wildlifedynamics.com
      role: owner
  outputs:
    - name: Movement Tracks Dashboard
      type: dashboard
      description: >-
        A Movement Tracks map widget: one view for the whole subject group by default,
        or one view per subject (switched with the dashboard's filter) when grouped by subject name.
      indicators:
        - name: Subject movement
    - name: Historic and Current Tracks Map
      type: map
      description: >-
        Each subject's current tracks drawn over its historic tracks, with a legend for
        the two periods.
      indicators:
        - name: Subject movement
    - name: Track Data
      type: file
      description: >-
        The cleaned relocations and trajectory segments for the current and historic
        periods (GeoParquet).
      indicators:
        - name: Subject movement
  license: BSD-3-Clause
  repository: https://github.com/wildlife-dynamics/subject-historic-current-tracks-map
  documentation: https://github.com/wildlife-dynamics/subject-historic-current-tracks-map#readme
  readme: README.md
  keywords: [movement, tracks, trajectories, comparison, historic, subjects, earthranger]
  thumbnail: resources/thumbnail.png
requirements:
- name: ecoscope-platform
  version: ==2.25.3
  channel: https://repo.prefix.dev/ecoscope-workflows/

- name: ecoscope-workflows-ext-custom
  version: "0.1.4.*"
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-ste
  version: "0.0.24.*"
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: pydeck
  version: ==0.9.2
  channel: conda-forge

rjsf-overrides:
  properties:
    # Groupers: only "All" (leave the list empty, the default) or Category → Subject Name.
    groupers.properties.groupers.title: Group by
    groupers.properties.groupers.description: >-
      Add a Subject Name entry to split the dashboard into one map per subject.
      Leave it empty to show all subjects on a single map.
    groupers.properties.groupers.items.anyOf:
    - type: object
      title: Category
      properties:
        index_name:
          title: Category
          type: string
          oneOf:
          - const: subject_name
            title: Subject Name
          default: subject_name
      required:
      - index_name

    # Subject Group: a drop-down of the chosen EarthRanger site's subject group names
    Subject Group.properties.subject_group_name.properties.var:
      title: Subject Group Name
      type: string
      description: The EarthRanger subject group to map, picked from the chosen data source's subject groups.
      ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: subject_group_name
          depends_on: properties.er_connection.properties.data_source.properties.name

    # Comparison period: defaults to a period as long as the current one, ending where it starts
    previous_time_range.description: "The earlier period whose tracks are drawn as historic tracks, under the current tracks (grey by default). It always ends where the current time range starts."
    previous_time_range.properties.offset.title: Comparison Period Length
    previous_time_range.properties.offset.description: "How far back the comparison period starts: a preset (e.g. the same length as the current period), a custom offset, or a start date picked on the calendar."
    previous_time_range.properties.offset.default:
      preset: Same as current period

    # Track Colors: colour pickers for historic and current tracks
    status_color_columns.properties.previous_color_hex:
      title: Historic Tracks Color
      type: string
      format: color
      default: '#a9a9a9'
      description: Colour of the tracks from the historic period.
    status_color_columns.properties.use_hex_column_for_current:
      title: Use subject colors for current tracks
      type: boolean
      default: true
      description: Colour each subject's current tracks with its EarthRanger colour. Untick to use the Current Tracks Color below for every subject.
    status_color_columns.properties.default_current_hex:
      title: Current Tracks Color
      type: string
      format: color
      default: '#6495ed'
      description: Colour of the current tracks when "Use subject colors for current tracks" is unticked.

  $defs:
    PresetPreviousPeriod.properties.preset.default: Same as current period

  uiSchema:
    # Keep the historic/current colour pickers swatch-sized instead of stretching across the form.
    # The form applies ui:style to the field's wrapper.
    status_color_columns.previous_color_hex.ui:style:
      maxWidth: 120px
    status_color_columns.default_current_hex.ui:style:
      maxWidth: 120px

task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped

workflow:
- name: Set Workflow Details
  id: workflow_details
  task: set_workflow_details

- name: Set Groupers
  id: groupers
  task: set_groupers

- name: Connect to EarthRanger
  id: er_connection
  task: set_er_connection

- name: Set Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y %H:%M:%S'

- name: Trajectory Segment Filter
  id: segment_filter
  task: trajectory_segment_filter

- title: Subject Group
  type: task-group
  description: Choose subject group to analyze 
  tasks:
    - name: null
      id: subject_group_name
      task: set_string_var

- name: Base Maps
  id: base_maps_pydeck
  task: set_base_maps

- name: Current Subject Group Observations
  id: current_observations
  task: get_subjectgroup_observations
  partial:
    client: ${{ workflow.er_connection.return }}
    time_range: ${{ workflow.time_range.return }}
    subject_group_name: ${{ workflow.subject_group_name.return }}
    raise_on_empty: true
    include_details: false
    include_subjectsource_details: false
    filter: clean
    include_subject_additional: false

- name: Comparison Period
  id: previous_time_range
  task: flexible_previous_period
  partial:
    timerange: ${{ workflow.time_range.return }}

- name: Process Current Relocations
  id: current_relocations
  task: process_relocations
  partial:
    observations: ${{ workflow.current_observations.return }}
    filter_point_coords:
    - x: 180
      y: 90
    - x: 0
      y: 0
    - x: 1
      y: 1
    relocs_columns:
    - extra__subject_id
    - extra__id
    - extra__location
    - extra__created_at
    - extra__recorded_at
    - extra__source
    - extra__exclusion_flags
    - extra__subject__updated_at
    - extra__subject__name
    - extra__subject__hex
    - extra__subject__sex
    - extra__subject__subject_subtype
    - geometry
    - groupby_col
    - fixtime
    - junk_status

- name: Previous Subject Group Observations
  id: previous_observations
  task: get_subjectgroup_observations
  partial:
    client: ${{ workflow.er_connection.return }}
    time_range: ${{ workflow.previous_time_range.return }}
    subject_group_name: ${{ workflow.subject_group_name.return }}
    raise_on_empty: false
    include_details: false
    include_subjectsource_details: false
    filter: clean
    include_subject_additional: false

- name: Current Relocations to Trajectories
  id: current_relocs_to_trajs
  task: relocations_to_trajectory
  partial:
    relocations: ${{ workflow.current_relocations.return }}
    trajectory_segment_filter: ${{ workflow.segment_filter.return }}

- name: Process Previous Relocations
  id: previous_relocations
  task: process_relocations
  partial:
    observations: ${{ workflow.previous_observations.return }}
    filter_point_coords:
    - x: 180
      y: 90
    - x: 0
      y: 0
    - x: 1
      y: 1
    relocs_columns:
    - extra__subject_id
    - extra__id
    - extra__location
    - extra__created_at
    - extra__recorded_at
    - extra__source
    - extra__exclusion_flags
    - extra__subject__updated_at
    - extra__subject__name
    - extra__subject__hex
    - extra__subject__sex
    - extra__subject__subject_subtype
    - geometry
    - groupby_col
    - fixtime
    - junk_status

- name: Persist Previous Relocations
  id: persist_previous_relocations
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.previous_relocations.return }}
    filetype: geoparquet
    filename: historic_relocations

- name: Persist Current Relocations
  id: persist_current_relocations
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.current_relocations.return }}
    filename: current_relocations
    filetype: geoparquet

- name: Map Columns
  id: map_current_trajs
  task: map_columns
  partial:
    df: ${{ workflow.current_relocs_to_trajs.return }}
    rename_columns:
      extra__hex: hex_color
      extra__name: subject_name
      extra__sex: subject_sex
      extra__subject_subtype: subject_subtype
      extra__created_at: created_at
    drop_columns: []
    retain_columns: []
    raise_if_not_found: true
    duplicate_strategy: suffix

- name: Previous Relocations to Trajectories
  id: previous_relocs_to_trajs
  task: relocations_to_trajectory
  partial:
    relocations: ${{ workflow.previous_relocations.return }}
    trajectory_segment_filter: ${{ workflow.segment_filter.return }}

- name: Persist Current Trajectories
  id: persist_current_trajectories
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.current_relocs_to_trajs.return }}
    filename: current_trajectories
    filetype: geoparquet

- name: Current Duration Status
  id: current_duration_status
  task: add_new_column
  partial:
    df: ${{ workflow.map_current_trajs.return }}
    column_name: duration_status
    default_value: Current Tracks

- name: Map Columns
  id: map_previous_trajs
  task: map_columns
  partial:
    df: ${{ workflow.previous_relocs_to_trajs.return }}
    rename_columns:
      extra__hex: hex_color
      extra__name: subject_name
      extra__sex: subject_sex
      extra__subject_subtype: subject_subtype
      extra__created_at: created_at
    drop_columns: []
    retain_columns: []
    raise_if_not_found: true
    duplicate_strategy: suffix

- name: Persist Previous Trajectories
  id: persist_previous_trajectories
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.previous_relocs_to_trajs.return }}
    filename: historic_trajectories
    filetype: geoparquet

- name: Previous Duration Status
  id: previous_duration_status
  task: add_new_column
  partial:
    df: ${{ workflow.map_previous_trajs.return }}
    column_name: duration_status
    default_value: Historic Tracks

- name: Concatenate Current and Previous Dataframes
  id: dataframes
  task: concatenate_dataframes
  skipif:
    conditions:
      - never
  partial:
    list_df:
    - ${{ workflow.previous_duration_status.return }}
    - ${{ workflow.current_duration_status.return }}
    axis: 0
    join: outer
    ignore_index: true
    keys: null
    levels: null
    names: null
    verify_integrity: false
    sort: false
    copy: null

- name: Add Temporal Index
  id: temporal_index
  task: add_temporal_index
  partial:
    df: ${{ workflow.dataframes.return }}
    groupers: ${{ workflow.groupers.return }}
    time_col: segment_start
    cast_to_datetime: true
    format: mixed

- name: Split Groups
  id: groups
  task: split_groups
  partial:
    df: ${{ workflow.temporal_index.return }}
    groupers: ${{ workflow.groupers.return }}

# Historic tracks get one colour; current tracks use each subject's EarthRanger
# hex_color unless the checkbox is unticked, then the picked colour.
- name: Track Colors
  id: status_color_columns
  task: add_status_color_columns
  partial:
    hex_column: hex_color
    current_status: Current Tracks
    status_column: duration_status
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.groups.return }}

# Current tracks always draw on top of historic tracks; this isn't on the form.
# Rows draw in order, so the label sorted last ends up on top. "Current Tracks" sorts
# before "Historic Tracks", so descending puts the current rows last, over the historic ones.
- name: Track Order
  id: sort_values_by_status
  task: sort_values
  partial:
    column_name: duration_status
    ascending: false
    na_position: last
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.status_color_columns.return }}

- name: Subset Columns
  id: columns
  task: subset_columns
  partial:
    columns:
    - duration_status
    - duration_status_colors
    - geometry
    - subject_name
    exclude: null
    strict: false
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.sort_values_by_status.return }}

- name: Create Path Layer
  id: path_layer
  task: create_path_layer
  partial:
    tooltip_columns:
      - duration_status
      - subject_name
      - duration_status_colors
    layer_style:
      auto_highlight: false
      opacity: 0.75
      pickable: true
      get_path: geometry.coordinates
      get_color: duration_status_colors
      get_width: 2.25
      width_scale: 1
      width_min_pixels: 0
      width_max_pixels: null
      width_units: pixels
      cap_rounded: true
      joint_rounded: false
      billboard: false
      rounded: true
      extruded: false
      wireframe: true
    legend:
      title: Legend
      label_column: duration_status
      color_column: duration_status_colors
      sort: ascending
      label_suffix: null
    data_url: null
  mapvalues:
    argnames:
    - geodataframe
    argvalues: ${{ workflow.columns.return }}

- name: Compute View State From Gdf
  id: view_state_from_gdf
  task: compute_view_state_from_gdf
  partial:
    pitch: 0
    bearing: 0
    max_zoom: 18.0
  mapvalues:
    argnames:
    - gdf
    argvalues: ${{ workflow.columns.return }}

- name: Groupbykey
  id: groupbykey_step
  task: groupbykey
  partial:
    iterables:
    - ${{ workflow.path_layer.return }}
    - ${{ workflow.view_state_from_gdf.return }}

- name: Draw Current Previous Map
  id: current_previous_map
  task: draw_map
  partial:
    output_type: html
    tile_layers: ${{ workflow.base_maps_pydeck.return }}
    static: false
    title: null
    legend_style:
      placement: bottom-right
    max_zoom: 20
  mapvalues:
    argnames:
    - geo_layers
    - view_state
    argvalues: ${{ workflow.groupbykey_step.return }}

- name: Persist map as HTML
  id: persist_map
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.current_previous_map.return }}

- name: Create Map Widget Single View
  id: map_widget_single_view
  task: create_map_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Movement Tracks
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.persist_map.return }}

- name: Merge Widget Views
  id: widget_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.map_widget_single_view.return }}

- name: Gather Dashboard
  id: dashboard
  task: gather_dashboard
  partial:
    widgets: ${{ workflow.widget_views.return }}
    groupers: ${{ workflow.groupers.return }}
    time_range: ${{ workflow.time_range.return }}
    details: ${{ workflow.workflow_details.return }}

